services:
  - type: web
    name: atomgrid-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_EMAIL_DOMAIN
        value: atomgrid.in
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: EWB_API_BASE_URL
        sync: false
      - key: EWB_AUTH_PATH
        value: /v1.03/auth
      - key: EWB_GET_PATH
        value: /v1.03/ewayapi/GetEwayBill
      - key: EWB_CLIENT_ID
        sync: false
      - key: EWB_CLIENT_SECRET
        sync: false
      - key: EWB_GSTIN
        sync: false
      - key: EWB_USERNAME
        sync: false
      - key: EWB_PASSWORD
        sync: false
      - key: EWB_PUBLIC_KEY
        sync: false
      - key: EWB_TIMEOUT_SECONDS
        value: "30"
